name: CI

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:

  test:
    name: "varnishtest and example compile"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test
        run: make test
      - name: Release tag matches version.txt
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cat version.txt)"
          if [ "$version" != "$TAG" ]; then
            echo "Tag $TAG does not match version.txt ($version)"
            exit 1
          fi

  image:
    name: "Image"
    needs:
      - test
    # Only for release tags: a release pushes main and the tag at once, which
    # are two runs, and only one of them should build and publish.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    uses: plone/meta/.github/workflows/container-image-build-push.yml@2.x
    permissions:
      contents: read
      packages: write
    with:
      base-tag: ${{ github.ref_name }}
      working-directory: "."
      image-name-prefix: ghcr.io/zestsoftware/plone
      image-name-suffix: varnish
      platforms: linux/amd64,linux/arm64
      push: true
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}
