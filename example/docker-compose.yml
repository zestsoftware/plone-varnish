# Example stack: Plone 6 with Volto behind Traefik and Varnish.
#
#     cd example
#     docker compose up -d --build
#     open http://plone.localhost:8090      (admin / admin)
#     docker compose down -v
#
# The way a request goes:
#
#   browser
#     │  http://plone.localhost:8090/news
#     ▼
#   Traefik, entrypoint web (:80, published as 8090)
#     │  router rt-public: Host → Varnish.  Nothing is rewritten here, and
#     │  Traefik puts the client in X-Forwarded-For (it trusts nobody on
#     │  this entrypoint, so what the client sent is dropped).
#     ▼
#   Varnish (default.vcl): sees the public path /news, blocks junk, rate
#     │  limit, cache; sends the request back to Traefik on its internal
#     │  entrypoint, with only the client in X-Forwarded-For.
#     ▼
#   Traefik, entrypoint internal (:8000, not published)
#     │  /++api++/...  router rt-api: rewrite to
#     │                /VirtualHostBase/http/plone.localhost:8090/Plone/++api++/VirtualHostRoot/...
#     │                → Plone (REST API, for Volto in the browser)
#     │  /ClassicUI/... router rt-classic: rewrite to
#     │                /VirtualHostBase/http/plone.localhost:8090/Plone/VirtualHostRoot/_vh_ClassicUI/...
#     │                → Plone (Classic UI, for the ZMI and the control panel)
#     │  everything else: router rt-frontend, no rewrite → Volto
#     ▼
#   Volto / Plone
#
# Why a separate internal entrypoint, and not a router on the public
# entrypoint that matches a header like X-Varnish-Routed: anybody can send
# that header, and would then skip Varnish (its blocks and rate limit) and
# reach Plone directly.  Port 8000 is only reachable inside the network.
#
# A site without Volto (Classic UI) needs one internal router instead of the
# three, for all paths, with this rewrite:
#
#   replacepathregex.regex=^/(.*)
#   replacepathregex.replacement=/VirtualHostBase/http/plone.localhost:8090/Plone/VirtualHostRoot/$$1
#
# On a server behind TLS the rewrites start with /VirtualHostBase/https/<host>:443/.

name: plone-varnish-example

services:

  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Public: everything from outside.  No trustedIPs: X-Forwarded-For
      # from the client is replaced by the address of the client.
      - --entrypoints.web.address=:80
      # Internal: only for Varnish.  Its X-Forwarded-For (the client found
      # by zest_detect_client_ip) is kept, so Volto and Plone see the client.
      - --entrypoints.internal.address=:8000
      - --entrypoints.internal.forwardedHeaders.trustedIPs=172.31.231.11
      - --accesslog=true
    ports:
      - "${PUBLIC_PORT:-8090}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:
        # In zest_proxies in default.vcl.
        ipv4_address: 172.31.231.10

  varnish:
    # In a project: image: ghcr.io/zestsoftware/plone-varnish:1
    build: ..
    volumes:
      - ./default.vcl:/etc/varnish/default.vcl:ro
    environment:
      VARNISH_SIZE: 256M
    depends_on:
      - traefik
    networks:
      default:
        # In the trustedIPs of Traefik's internal entrypoint.
        ipv4_address: 172.31.231.11
    labels:
      - traefik.enable=true
      - traefik.http.services.svc-varnish.loadbalancer.server.port=80
      - traefik.http.routers.rt-public.rule=Host(`plone.localhost`)
      - traefik.http.routers.rt-public.entrypoints=web
      - traefik.http.routers.rt-public.service=svc-varnish

  frontend:
    image: plone/plone-frontend:19.8.2
    environment:
      # Server side rendering asks Plone directly, not through Varnish.
      RAZZLE_INTERNAL_API_PATH: http://backend:8080/Plone
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.services.svc-frontend.loadbalancer.server.port=3000
      - traefik.http.routers.rt-frontend.rule=Host(`plone.localhost`)
      - traefik.http.routers.rt-frontend.entrypoints=internal
      - traefik.http.routers.rt-frontend.service=svc-frontend

  backend:
    image: plone/plone-backend:6.2.3
    environment:
      # Creates the site at the first start.
      SITE: Plone
      TYPE: volto
    volumes:
      - data:/data
    labels:
      - traefik.enable=true
      - traefik.http.services.svc-backend.loadbalancer.server.port=8080

      # REST API, for Volto in the browser.
      - traefik.http.routers.rt-api.rule=Host(`plone.localhost`) && PathPrefix(`/++api++`)
      - traefik.http.routers.rt-api.entrypoints=internal
      - traefik.http.routers.rt-api.service=svc-backend
      - traefik.http.routers.rt-api.middlewares=mw-vhm-api
      - "traefik.http.middlewares.mw-vhm-api.replacepathregex.regex=^/\\+\\+api\\+\\+($$|/.*)"
      - "traefik.http.middlewares.mw-vhm-api.replacepathregex.replacement=/VirtualHostBase/http/plone.localhost:${PUBLIC_PORT:-8090}/Plone/++api++/VirtualHostRoot$$1"

      # Classic UI under /ClassicUI.
      - traefik.http.routers.rt-classic.rule=Host(`plone.localhost`) && PathPrefix(`/ClassicUI`)
      - traefik.http.routers.rt-classic.entrypoints=internal
      - traefik.http.routers.rt-classic.service=svc-backend
      - traefik.http.routers.rt-classic.middlewares=mw-vhm-classic
      - "traefik.http.middlewares.mw-vhm-classic.replacepathregex.regex=^/ClassicUI($$|/.*)"
      - "traefik.http.middlewares.mw-vhm-classic.replacepathregex.replacement=/VirtualHostBase/http/plone.localhost:${PUBLIC_PORT:-8090}/Plone/VirtualHostRoot/_vh_ClassicUI$$1"

networks:
  default:
    ipam:
      config:
        # Fixed, for the ACLs in default.vcl and Traefik's trustedIPs.
        - subnet: 172.31.231.0/24

volumes:
  data: {}
